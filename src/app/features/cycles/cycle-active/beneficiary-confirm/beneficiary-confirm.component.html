<mat-card>
  <mat-card-header>
    <mat-card-title>Vous êtes le bénéficiaire de ce cycle</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>Montant reçu : <strong>{{ montantVerse | number }} FCFA</strong></p>
    <p>Confirmez la réception pour permettre l'ouverture du prochain cycle.</p>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </mat-card-content>
  <mat-card-actions>
    <button
      mat-raised-button
      color="accent"
      [disabled]="loading()"
      (click)="confirm()"
    >
      @if (loading()) {
        <mat-spinner diameter="20" />
      } @else {
        Confirmer la réception
      }
    </button>
  </mat-card-actions>
</mat-card>
